# Next phase kickoff: full integration evaluation
# Combined benchmark (STEM + adversarial)

model:
  base_checkpoint: /Users/jdsingh/slm_v0/checkpoints/production_sml_v1.pt
  lora_checkpoint: /Users/jdsingh/slm_v0/checkpoints/phase2_lora/best_lora_adapter.pt
  tokenizer_model: /Users/jdsingh/slm_v0/model_32k.json
  device: auto
  dtype: float32

retrieval:
  bm25_index: /Users/jdsingh/slm_v0/main_dev_workspace/data/retrieval/bm25_index.json
  dense_index: /Users/jdsingh/slm_v0/main_dev_workspace/data/retrieval/dense_general/dense_index.faiss
  dense_metadata: /Users/jdsingh/slm_v0/main_dev_workspace/data/retrieval/dense_general/dense_index_metadata.jsonl
  embedding_model: allenai/scibert_scivocab_uncased
  fusion_method: rrf
  alpha: 0.5
  k_retrieve: 10
  context_docs: 4

reranker:
  enabled: true
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  strategy: hybrid
  top_n: 6
  cross_weight: 0.55
  semantic_weight: 0.30
  lexical_weight: 0.15

generation:
  max_tokens: 48
  temperature: 0.9
  top_k: 50
  top_p: 0.95
  prompt_mode: strict
  enforce_context_overlap: true
  faithfulness_floor: 0.25

tools:
  enabled: true

semantic_metrics:
  enabled: true
  embedding_model: all-mpnet-base-v2
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  max_tokens_for_bertscore: 80

calibrated_uncertainty:
  enabled: true
  logprob_spread_weight: 0.30
  context_weight: 0.25
  entailment_weight: 0.25
  faithfulness_weight: 0.20
  calibration_slope: 0.9
  calibration_offset: 0.1

iterative_retrieval:
  enabled: true
  max_iterations: 2
  uncertainty_threshold: 0.6
  followup_k_retrieve: 12

evaluation:
  dataset: /Users/jdsingh/slm_v0/main_dev_workspace/data/phase5_combined_100qa.json
  mode: mc_likelihood
  max_questions: 102
  output_dir: /Users/jdsingh/slm_v0/main_dev_workspace/results/rag_generation_eval
  enable_enhanced_metrics: true
  enable_semantic_metrics: true
