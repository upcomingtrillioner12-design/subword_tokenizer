# Phase 4 Task 10.2a: Model Scaling - Mistral-7B Baseline Experiment
# Goal: Test 7B parameter model vs 1.3B baseline on adversarial subset
# Expected: +5-10pp accuracy improvement
# Date: July 15, 2026

task: "phase4_task10_2a_scaling_7b"
description: "Scaling experiment: Mistral-7B-Instruct-v0.2 (quantized) vs 1.3B baseline on 20-question adversarial set"

# Retrieval (unchanged from Task 9: SciBERT winner)
retrieval:
  bm25_index: "data/retrieval/bm25_index.json"
  dense_index: "data/retrieval/dense_general/dense_index.faiss"
  dense_metadata: "data/retrieval/dense_general/dense_index_metadata.jsonl"
  embedding_model: "allenai/scibert_scivocab_uncased"
  fusion_method: "rrf"
  alpha: 0.5
  k_retrieve: 10
  context_docs: 4

# Reranking (unchanged: MS Marco hybrid strategy)
reranker:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  strategy: "hybrid"
  top_n: 6
  cross_weight: 0.55
  semantic_weight: 0.3
  lexical_weight: 0.15

# Generation: NEW LARGER MODEL (7B)
generation:
  # Model selection
  model_type: "mistral"
  model_name: "Mistral-7B-Instruct-v0.2"
  # NOTE: Will need to implement quantization wrapper in inference_lora.py
  # For now, fallback to 1.3B if 7B not available
  quantization: "int8"  # 8-bit quantization to fit on 16GB GPU
  device_map: "auto"
  
  # Generation parameters (same as Task 9)
  max_tokens: 48
  temperature: 0.9
  top_k: 50
  top_p: 0.95
  
  # Context grounding (same as Task 9)
  prompt_mode: "strict"
  enforce_context_overlap: true
  faithfulness_floor: 0.25

# Semantic metrics (same as Task 9: all 6 components)
semantic_metrics:
  enabled: true
  embedding_model: "all-mpnet-base-v2"
  nli_model: "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
  max_tokens_for_bertscore: 80

# NEW: Calibrated uncertainty (from Task 10.1)
calibrated_uncertainty:
  enabled: true
  logprob_spread_weight: 0.30
  context_weight: 0.25
  entailment_weight: 0.25
  faithfulness_weight: 0.20
  calibration_slope: 0.9
  calibration_offset: 0.1

# Evaluation config
evaluation:
  dataset: "data/phase4_task8_adversarial_subset_20qa.json"
  mode: "mc_likelihood"
  limit: null  # Full 20-question set

# Metadata
experiment:
  name: "Task 10.2a: 7B Model Scaling"
  comparison_baseline: "production_sml_v1.pt (1.3B)"
  metrics_to_track:
    - accuracy  # MC exact match
    - calibrated_uncertainty  # New confidence signal
    - avg_entailment_score  # Context grounding
    - faithfulness  # Hallucination rate
    - inference_time  # Latency impact
  expected_result: "+5-10pp accuracy improvement"
  success_criteria: "accuracy >= 40% (vs 35% baseline)"
