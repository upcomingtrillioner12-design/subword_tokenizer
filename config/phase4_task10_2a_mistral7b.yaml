# Phase 4 Task 10.2a: Model Scaling - Mistral-7B Baseline Experiment
# Goal: Test 7B parameter model vs 1.3B baseline on adversarial subset
# Expected: +5-10pp accuracy improvement
# Date: July 15, 2026
# NOTE: For initial run, using 1.3B baseline with calibrated uncertainty
# Will upgrade to Mistral-7B once HuggingFace model is available

task: "phase4_task10_2a_scaling_7b"
description: "Scaling experiment: 1.3B baseline with calibrated uncertainty on 20-question adversarial set (Mistral-7B TBD)"

# Model (1.3B baseline for now)
model:
  base_checkpoint: /Users/jdsingh/slm_v0/checkpoints/production_sml_v1.pt
  lora_checkpoint: /Users/jdsingh/slm_v0/checkpoints/phase2_lora/best_lora_adapter.pt
  tokenizer_model: /Users/jdsingh/slm_v0/model_32k.json
  device: auto
  dtype: float32

# Retrieval (unchanged from Task 9: SciBERT winner)
retrieval:
  bm25_index: "data/retrieval/bm25_index.json"
  dense_index: "data/retrieval/dense_general/dense_index.faiss"
  dense_metadata: "data/retrieval/dense_general/dense_index_metadata.jsonl"
  embedding_model: "allenai/scibert_scivocab_uncased"
  fusion_method: "rrf"
  alpha: 0.5
  k_retrieve: 10
  context_docs: 4

# Reranking (unchanged: MS Marco hybrid strategy)
reranker:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  strategy: "hybrid"
  top_n: 6
  cross_weight: 0.55
  semantic_weight: 0.3
  lexical_weight: 0.15

# Generation (same as Task 9)
generation:
  max_tokens: 48
  temperature: 0.9
  top_k: 50
  top_p: 0.95
  prompt_mode: strict
  enforce_context_overlap: true
  faithfulness_floor: 0.25

# Tools enabled
tools:
  enabled: true

# Semantic metrics (same as Task 9: all 6 components)
semantic_metrics:
  enabled: true
  embedding_model: all-mpnet-base-v2
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  max_tokens_for_bertscore: 80

# NEW: Calibrated uncertainty (from Task 10.1)
calibrated_uncertainty:
  enabled: true
  logprob_spread_weight: 0.30
  context_weight: 0.25
  entailment_weight: 0.25
  faithfulness_weight: 0.20
  calibration_slope: 0.9
  calibration_offset: 0.1

# Evaluation config
evaluation:
  dataset: /Users/jdsingh/slm_v0/subword_tokenizer/data/phase4_task8_adversarial_subset_20qa.json
  mode: mc_likelihood
  max_questions: 20
  output_dir: /Users/jdsingh/slm_v0/subword_tokenizer/results/rag_generation_eval
  enable_enhanced_metrics: true
  enable_semantic_metrics: true

# Metadata
experiment:
  name: "Task 10.2a: Baseline with Calibrated Uncertainty"
  comparison_baseline: "Task 9 (without calibrated uncertainty)"
  metrics_to_track:
    - accuracy
    - calibrated_uncertainty
    - avg_entailment_score
    - faithfulness
    - inference_time
  expected_result: "Better confidence signal + preserved accuracy"
  success_criteria: "MC accuracy >= 100% (correct baseline) + improved uncertainty discrimination"
