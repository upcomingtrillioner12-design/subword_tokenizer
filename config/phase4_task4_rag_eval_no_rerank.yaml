# Phase 4 Task 4: End-to-end RAG generation evaluation (no reranking)

model:
  base_checkpoint: /Users/jdsingh/slm_v0/checkpoints/production_sml_v1.pt
  lora_checkpoint: /Users/jdsingh/slm_v0/checkpoints/phase2_lora/best_lora_adapter.pt
  tokenizer_model: /Users/jdsingh/slm_v0/model_32k.json
  device: auto
  dtype: float32

retrieval:
  bm25_index: /Users/jdsingh/slm_v0/subword_tokenizer/data/retrieval/bm25_physics_papers_index.json
  dense_index: /Users/jdsingh/slm_v0/subword_tokenizer/data/retrieval/dense_physics/dense_index.faiss
  dense_metadata: /Users/jdsingh/slm_v0/subword_tokenizer/data/retrieval/dense_physics/dense_index_metadata.jsonl
  embedding_model: all-mpnet-base-v2
  fusion_method: rrf
  alpha: 0.5
  k_retrieve: 8
  context_docs: 3

reranker:
  enabled: false
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 5

generation:
  max_tokens: 48
  temperature: 1.2
  top_k: 80
  top_p: null

evaluation:
  dataset: /Users/jdsingh/slm_v0/subword_tokenizer/data/physics_qa_dataset.json
  mode: mc_likelihood
  max_questions: 20
  output_dir: /Users/jdsingh/slm_v0/subword_tokenizer/results/rag_generation_eval
