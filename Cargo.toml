[package]
name = "subword-tokenizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bpe-tokenizer"
path = "src/main.rs"

[lib]
name = "subword_tokenizer"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"
