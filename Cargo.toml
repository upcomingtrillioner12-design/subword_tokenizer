[package]
name = "subword-tokenizer"
version = "0.1.0"
edition = "2021"
default-run = "bpe-tokenizer"

[lib]
name = "subword_tokenizer"
path = "src/lib.rs"

[[bin]]
name = "bpe-tokenizer"
path = "src/main.rs"

[[bin]]
name = "prune"
path = "src/bin/prune.rs"

[dependencies]
rand = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
